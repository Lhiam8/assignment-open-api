<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Random User Generator</h1>
        </header>
        
        <div class="controls">
            <button onclick="getRandomUser()">Get Random User</button>
            <div class="input-group">
                <input type="number" id="userCount" min="1" max="10" value="5">
                <button onclick="getMultipleUsers()">Get Multiple Users</button>
            </div>
            <div class="gender-filter">
                <button onclick="getUsersByGender('male')">Get Male Users</button>
                <button onclick="getUsersByGender('female')">Get Female Users</button>
            </div>
        </div>

        <div class="results" id="results">
            <!-- Results will be displayed here -->
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
